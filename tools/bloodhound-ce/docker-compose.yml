# ============================================================================
# BloodHound Community Edition — Docker Compose stack
# Usage: docker compose up -d
# Web UI: http://localhost:8080  (default creds: admin / [generated on first run])
# ============================================================================

services:
  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      - bloodhound_config_path=/bloodhound.config.json
    volumes:
      - ./bloodhound.config.json:/bloodhound.config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

  app-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  graph-db:
    image: docker.io/library/neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
      # Force bolt to listen on IPv4 and advertise the service hostname so
      # BloodHound's Go dial never receives a bare ":7687" (::7687) address.
      NEO4J_dbms_connector_bolt_listen__address: "0.0.0.0:7687"
      NEO4J_dbms_connector_bolt_advertised__address: "graph-db:7687"
      NEO4J_dbms_connector_http_listen__address: "0.0.0.0:7474"
      NEO4J_dbms_connector_http_advertised__address: "graph-db:7474"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:

networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "false"
