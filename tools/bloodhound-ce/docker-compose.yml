# ============================================================================
# BloodHound Community Edition — Docker Compose stack
# Usage: docker compose up -d
# Web UI: http://localhost:8888  (default creds: admin / [generated on first run])
# ============================================================================
#
# HOST PORT MAP (all bound to 127.0.0.1 — never exposed on 0.0.0.0):
#   127.0.0.1:55432  → app-db      (Postgres) — debug only; BHCE connects via 172.28.1.2:5432
#   127.0.0.1:7687   → graph-db    (Neo4j bolt) — operator bolt client access
#   127.0.0.1:7474   → graph-db    (Neo4j browser UI)
#   127.0.0.1:8888   → bloodhound  (BloodHound CE web UI)
#
# Rationale for non-standard host ports:
#   - 55432 (not 5432): Kali ships with Postgres enabled by default on 5432.
#     Publishing 5432 causes `bind: address already in use` on fresh installs.
#     55432 is in the ephemeral range yet above all common service ports.
#   - 8888 (not 8080): 8080 is heavily contested on pentest boxes (Burp,
#     dev servers, corp proxies). 8888 rarely collides.
#   Container-to-container traffic is unaffected — it flows over the bhce
#   bridge using the static IPv4 addresses below.
#
# ── Subnet-conflict note ───────────────────────────────────────────────────
# The 172.28.1.0/24 subnet below can collide with:
#   (a) Existing Docker networks on the host (docker network ls)
#   (b) VPN routes common on pentest boxes — OpenVPN/WireGuard engagements
#       frequently use 172.16.0.0/12 space for client tunnels.
# If a collision occurs, Docker will fail to create the network OR the
# bridge will black-hole traffic intended for the VPN peer.
# Check before `docker compose up -d`:
#   docker network ls --format '{{.Name}}: {{.Driver}}'
#   ip route | grep 172.28
# If either lists a conflicting entry, pick a free /24 (e.g. 10.77.7.0/24
# or 192.168.77.0/24) and update BOTH:
#   - networks.bhce.ipam.config[0].subnet + .gateway below
#   - Every service's networks.bhce.ipv4_address
#   - tools/bloodhound-ce/bloodhound.config.json (postgres host + bolt URL)
# phase0_setup.sh runs an automated check for this subnet before startup.

networks:
  # Named bridge network with an explicit IPv4-only IPAM block.
  # enable_ipv6: false stops Docker assigning an IPv6 subnet so the embedded
  # DNS resolver never returns an IPv6 address for service hostnames.
  # Static IPs are assigned so resolution is deterministic regardless of
  # start order.
  bhce:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1

services:
  app-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      bhce:
        ipv4_address: 172.28.1.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  graph-db:
    # Neo4j 4.4 is SpecterOps' documented minimum for BloodHound CE. Neo4j 5.x
    # is also supported and sidesteps most of the IPv6 routing-table quirks
    # fixed below — if you hit persistent bolt issues, bump this to neo4j:5.
    # Upgrade path: stop the stack, wipe the neo4j-data volume (see phase0),
    # switch the tag, and restart. Credentials and config stay the same.
    image: docker.io/library/neo4j:4.4
    # Explicit hostname so Neo4j always advertises "graph-db" in its routing
    # table response — regardless of the container's short ID hostname.
    # BloodHound's Go bolt driver receives "graph-db:7687" from the routing
    # table, resolves it via Docker's embedded DNS (127.0.0.11), and gets the
    # static IPv4 address 172.28.1.3 — no IPv6 involvement, no colon error.
    # This is the same approach used in SpecterOps' official docker-compose.
    # All NEO4J_ env vars for advertised_address have been removed because
    # Neo4j 4.4 ignores them in practice (the log still shows the container
    # hostname despite setting them) — hostname: is the reliable mechanism.
    hostname: graph-db
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
      NEO4J_dbms_jvm_additional: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    networks:
      bhce:
        ipv4_address: 172.28.1.3
    healthcheck:
      # A TCP probe against the HTTP browser (7474) only proves the JVM is up
      # and the web connector is bound — NOT that the bolt connector (7687) is
      # accepting connections. BloodHound speaks bolt, not HTTP, so the gate
      # on `depends_on: service_healthy` MUST verify bolt readiness or else
      # BloodHound starts too early and fails its initial Neo4j handshake.
      # /dev/tcp is a bash builtin that opens a socket without needing nc/ncat
      # (neither are installed in the default neo4j image). We invoke bash
      # explicitly because CMD-SHELL uses /bin/sh → dash on Debian, and dash
      # does NOT implement the /dev/tcp pseudo-device.
      test: ["CMD", "bash", "-c", "wget -q -O /dev/null http://localhost:7474 && (echo > /dev/tcp/localhost/7687) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      # Neo4j 4.4 first-boot initialization (creating the data directory, applying
      # allow__upgrade, binding connectors) can exceed the prior 90s budget on
      # slower hosts and cold image pulls — bumping to 120s prevents spurious
      # "unhealthy" flips that stall BloodHound's `depends_on: service_healthy`.
      start_period: 120s
    restart: unless-stopped

  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      - bloodhound_config_path=/bloodhound.config.json
    volumes:
      - ./bloodhound.config.json:/bloodhound.config.json:ro
    ports:
      # SYNC: phase0_setup.sh polls localhost:8888 — must match this port
      - "127.0.0.1:8888:8080"
    networks:
      bhce:
        ipv4_address: 172.28.1.4
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
