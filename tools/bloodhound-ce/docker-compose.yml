# ============================================================================
# BloodHound Community Edition — Docker Compose stack
# Usage: docker compose up -d
# Web UI: http://localhost:8888  (default creds: admin / [generated on first run])
# ============================================================================
#
# HOST PORT MAP (all bound to 127.0.0.1 — never exposed on 0.0.0.0):
#   127.0.0.1:55432  → app-db      (Postgres) — debug only; BHCE connects via 172.28.1.2:5432
#   127.0.0.1:7687   → graph-db    (Neo4j bolt) — operator bolt client access
#   127.0.0.1:7474   → graph-db    (Neo4j browser UI)
#   127.0.0.1:8888   → bloodhound  (BloodHound CE web UI)
#
# Rationale for non-standard host ports:
#   - 55432 (not 5432): Kali ships with Postgres enabled by default on 5432.
#     Publishing 5432 causes `bind: address already in use` on fresh installs.
#     55432 is in the ephemeral range yet above all common service ports.
#   - 8888 (not 8080): 8080 is heavily contested on pentest boxes (Burp,
#     dev servers, corp proxies). 8888 rarely collides.
#   Container-to-container traffic is unaffected — it flows over the bhce
#   bridge using the static IPv4 addresses below.
#
# ── Subnet-conflict note ───────────────────────────────────────────────────
# The 172.28.1.0/24 subnet below can collide with:
#   (a) Existing Docker networks on the host (docker network ls)
#   (b) VPN routes common on pentest boxes — OpenVPN/WireGuard engagements
#       frequently use 172.16.0.0/12 space for client tunnels.
# If a collision occurs, Docker will fail to create the network OR the
# bridge will black-hole traffic intended for the VPN peer.
# Check before `docker compose up -d`:
#   docker network ls --format '{{.Name}}: {{.Driver}}'
#   ip route | grep 172.28
# If either lists a conflicting entry, pick a free /24 (e.g. 10.77.7.0/24
# or 192.168.77.0/24) and update BOTH:
#   - networks.bhce.ipam.config[0].subnet + .gateway below
#   - Every service's networks.bhce.ipv4_address
#   - tools/bloodhound-ce/bloodhound.config.json (postgres host + bolt URL)
# phase0_setup.sh runs an automated check for this subnet before startup.

networks:
  # Named bridge network with an explicit IPv4-only IPAM block.
  # enable_ipv6: false stops Docker assigning an IPv6 subnet so the embedded
  # DNS resolver never returns an IPv6 address for service hostnames.
  # Static IPs are assigned so resolution is deterministic regardless of
  # start order.
  bhce:
    driver: bridge
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: 172.28.1.0/24
          gateway: 172.28.1.1

services:
  app-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      bhce:
        ipv4_address: 172.28.1.2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  graph-db:
    # Neo4j 5 — upgraded from 4.4 because 4.4 ignores NEO4J_* env vars for
    # the bolt advertised address in practice: the routing table always
    # returns the JVM's dual-stack listen socket (::7687) regardless of any
    # dbms.connector.bolt.advertised_address or dbms.default_advertised_address
    # setting, causing BloodHound's Go driver to fail with "too many colons".
    # Neo4j 5 honours server.bolt.advertised_address reliably.
    # Property naming in Neo4j 5 env vars: dots→_, underscores→__, prefix NEO4J_
    image: docker.io/library/neo4j:5
    hostname: graph-db
    # extra_hosts writes directly to /etc/hosts inside the Neo4j container.
    # This guarantees InetAddress.getLocalHost() returns 172.28.1.3 (IPv4)
    # when Neo4j looks up its own hostname to populate the bolt routing table.
    # Without this, Docker DNS may return :: (IPv6) for "graph-db" even on an
    # IPv4-only network, causing the routing table to advertise ::7687 and
    # BloodHound's Go driver to fail with "too many colons in address".
    extra_hosts:
      - "graph-db:172.28.1.3"
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_server_jvm_additional: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    networks:
      bhce:
        ipv4_address: 172.28.1.3
    healthcheck:
      test: ["CMD", "bash", "-c", "wget -q -O /dev/null http://localhost:7474 && (echo > /dev/tcp/localhost/7687) 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    restart: unless-stopped

  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      - bloodhound_config_path=/bloodhound.config.json
    # Force graph-db and app-db to resolve to IPv4 inside the BloodHound
    # container — belt-and-braces against Docker DNS returning IPv6 addresses.
    extra_hosts:
      - "graph-db:172.28.1.3"
      - "app-db:172.28.1.2"
    volumes:
      - ./bloodhound.config.json:/bloodhound.config.json:ro
    ports:
      # SYNC: phase0_setup.sh polls localhost:8888 — must match this port
      - "127.0.0.1:8888:8080"
    networks:
      bhce:
        ipv4_address: 172.28.1.4
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
