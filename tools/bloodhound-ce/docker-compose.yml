# ============================================================================
# BloodHound Community Edition — Docker Compose stack
# Usage: docker compose up -d
# Web UI: http://localhost:8888  (default creds: admin / [see logs])
# ============================================================================
#
# HOST PORT MAP (all bound to 127.0.0.1):
#   127.0.0.1:55432  → app-db   (Postgres) — debug only
#   127.0.0.1:7687   → graph-db (Neo4j bolt)
#   127.0.0.1:7474   → graph-db (Neo4j browser UI)
#   127.0.0.1:8888   → bloodhound (BloodHound CE web UI)
#
# NETWORK: intentionally uses the default Docker bridge, not a custom named
# network. The custom bhce network with static IPs caused Neo4j's JVM to
# bind dual-stack sockets and report ::7687 in the bolt routing table on
# hosts with IPv6 enabled at the kernel level, making the Go bolt driver fail
# with "too many colons in address". The default bridge is IPv4-only by
# default and matches the approach in SpecterOps' official docker-compose.
# Container-to-container traffic uses Docker service name DNS (app-db,
# graph-db) — see bloodhound.config.json for connection strings.

services:
  app-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    ports:
      # 55432 not 5432: Kali ships with Postgres on 5432 by default.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  graph-db:
    image: docker.io/library/neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      - bloodhound_config_path=/bloodhound.config.json
    volumes:
      - ./bloodhound.config.json:/bloodhound.config.json:ro
    ports:
      - "127.0.0.1:8888:8080"
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
