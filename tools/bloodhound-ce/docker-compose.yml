# ============================================================================
# BloodHound Community Edition — Docker Compose stack
# Usage: docker compose up -d
# Web UI: http://localhost:8888  (default creds: admin / [see logs])
# ============================================================================
#
# HOST PORT MAP (all bound to 127.0.0.1):
#   127.0.0.1:55432  → app-db   (Postgres) — debug only
#   127.0.0.1:7687   → graph-db (Neo4j bolt)
#   127.0.0.1:7474   → graph-db (Neo4j browser UI)
#   127.0.0.1:8888   → bloodhound (BloodHound CE web UI)

services:
  app-db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: bloodhound
      POSTGRES_PASSWORD: bloodhoundcommunityedition
      POSTGRES_DB: bloodhound
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloodhound"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  graph-db:
    image: docker.io/library/neo4j:4.4
    environment:
      NEO4J_AUTH: neo4j/bloodhoundcommunityedition
      NEO4J_dbms_allow__upgrade: "true"
    # Disable IPv6 inside the Neo4j container at the kernel level.
    # Root cause of "::7687: too many colons in address":
    #   The attack machine has IPv6 enabled in the kernel. Every Docker bridge
    #   (user-defined or default) receives an IPv6 link-local address from the
    #   host kernel regardless of Docker's enable_ipv6 or ipv6:false settings.
    #   Neo4j's JVM sees this IPv6 interface and binds a dual-stack socket on
    #   :::7687. When Neo4j builds its bolt routing table it reports the
    #   unspecified IPv6 address as "::7687" (no brackets). BloodHound's Go
    #   bolt driver passes that string to net.Dial which rejects it.
    #   sysctls disables IPv6 inside this container's network namespace only —
    #   the host and all other containers are unaffected. With IPv6 gone, the
    #   JVM binds IPv4-only (0.0.0.0:7687) and the routing table returns a
    #   valid IPv4 address/hostname.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  bloodhound:
    image: specterops/bloodhound:latest
    environment:
      - bloodhound_config_path=/bloodhound.config.json
    volumes:
      - ./bloodhound.config.json:/bloodhound.config.json:ro
    ports:
      - "127.0.0.1:8888:8080"
    depends_on:
      app-db:
        condition: service_healthy
      graph-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  neo4j-data:
