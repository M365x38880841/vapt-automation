# Neo4j 5 configuration for BloodHound CE
# Mounted at /var/lib/neo4j/conf/neo4j.conf inside the container.
# Written directly to bypass the Docker entrypoint's NEO4J_* env var
# processing, which silently fails to apply advertised_address settings
# in both 4.4 and 5.x — causing the JVM to report the dual-stack socket
# address (::7687) in the bolt routing table instead of the static IPv4.

# ── Bolt connector ────────────────────────────────────────────────────────────
server.bolt.listen_address=0.0.0.0:7687
# Explicit static IPv4 — this is what BloodHound receives from the routing
# table and dials for all subsequent connections. Without this, Neo4j uses
# InetAddress.getLocalHost() which returns :: on dual-stack Docker hosts.
server.bolt.advertised_address=172.28.1.3:7687

# ── HTTP connector ────────────────────────────────────────────────────────────
server.http.listen_address=0.0.0.0:7474
server.http.advertised_address=172.28.1.3:7474

# ── Default advertised address (base for all connectors) ─────────────────────
server.default_advertised_address=172.28.1.3

# ── JVM ──────────────────────────────────────────────────────────────────────
server.jvm.additional=-Djava.net.preferIPv4Stack=true
server.jvm.additional=-Djava.net.preferIPv4Addresses=true
